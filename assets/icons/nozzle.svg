<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <!-- Nozzle head -->
    <circle cx="50" cy="30" r="15" fill="none" stroke="currentColor" stroke-width="2"/>
    <!-- Heating block -->
    <rect x="40" y="42" width="20" height="25" fill="none" stroke="currentColor" stroke-width="2" rx="2"/>
    <!-- Nozzle tip -->
    <path d="M 45 67 L 50 75 L 55 67 Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
    <!-- Center opening -->
    <circle cx="50" cy="30" r="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <!-- Heat lines -->
    <line x1="35" y1="50" x2="30" y2="50" stroke="currentColor" stroke-width="1.5" opacity="0.6"/>
    <line x1="65" y1="50" x2="70" y2="50" stroke="currentColor" stroke-width="1.5" opacity="0.6"/>
</svg>
